[project]
name = "stl-transit"
version = "0.1.0"
description = "Developer tooling for the Light Phone 3 St. Louis transit tool: GTFS/GTFS-RT inspection, test-oracle generation, and feed surveillance."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stl = "stl_transit.cli.main:app"
stl-mcp = "stl_transit.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stl_transit = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
